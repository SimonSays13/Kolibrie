name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Format check
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        run: swift build 2>&1 | tee build.log
      - name: No Swift warnings
        run: "! grep -E 'warning:' build.log | grep -v 'ld: warning'"
      - name: Test
        run: swift test
